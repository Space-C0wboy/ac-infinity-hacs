# Lint and format config; the pinned ruff version lives in requirements-lint.txt.
line-length = 100
target-version = "py313"  # keeps code valid on 3.13 (e.g. no PEP 758 bare except tuples)

[lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = [
    "E501",  # line-too-long: the formatter handles length
]

[format]
exclude = ["*.md"]  # ruff 0.17 also formats code blocks in Markdown; docs keep their own layout
